<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guitar Hole Count</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: light-dark(#ffffff, #171717);
        --surface: light-dark(#f5f5f2, #242424);
        --surface-strong: light-dark(#e9e9e5, #303030);
        --text: light-dark(#171717, #f4f4f4);
        --muted: light-dark(#6d6d68, #aaa9a4);
        --line: light-dark(#e2e2dd, #3a3a3a);
        --accent: light-dark(#171717, #f4f4f4);
        --accent-text: light-dark(#ffffff, #171717);
        --danger: #c43b3b;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; }
      body { margin: 0; background: transparent; color: var(--text); }
      button, input { font: inherit; }

      main {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 18px;
        background: var(--bg);
      }

      .view { padding: 18px; }
      .hidden { display: none !important; }

      .topline {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .eyebrow {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.13em;
      }

      .total-wrap { text-align: right; }
      .total {
        display: block;
        font-size: 44px;
        font-weight: 780;
        letter-spacing: -0.05em;
        line-height: 0.9;
      }
      .total-label {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .rows {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
      }

      .count-row {
        min-height: 58px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 11px;
        border-bottom: 1px solid var(--line);
      }

      .label {
        min-width: 0;
        overflow: hidden;
        font-weight: 640;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .balance { min-width: 80px; text-align: right; }
      .remaining { font-size: 20px; font-weight: 740; }
      .remaining-word { color: var(--muted); font-size: 11px; }

      .minus {
        width: 42px;
        height: 38px;
        border: 0;
        border-radius: 11px;
        background: var(--surface-strong);
        color: var(--text);
        cursor: pointer;
        font-size: 21px;
        font-weight: 720;
      }
      .minus:hover:not(:disabled) { filter: brightness(0.96); }
      .minus:active:not(:disabled) { transform: scale(0.97); }
      .minus:disabled { cursor: default; opacity: 0.38; }

      .summary {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 13px;
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 15px;
      }

      .button {
        min-height: 40px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
        font-weight: 650;
      }
      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
      }
      .button.ghost { color: var(--muted); }
      .button:disabled { cursor: default; opacity: 0.5; }

      .editor-title {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.02em;
      }
      .editor-subtitle {
        margin: 5px 0 15px;
        color: var(--muted);
        font-size: 13px;
      }

      .entry-list { display: flex; flex-direction: column; gap: 8px; }
      .entry-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 78px 34px;
        gap: 8px;
      }
      .entry-row input {
        width: 100%;
        min-height: 42px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: var(--surface);
        color: var(--text);
      }
      .entry-row input:focus { border-color: var(--muted); }
      .entry-row input[type="number"] { text-align: center; }
      .remove-row {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
      }

      .editor-total {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .editor-total strong { color: var(--text); font-size: 18px; }

      .error {
        min-height: 18px;
        margin-top: 8px;
        color: var(--danger);
        font-size: 12px;
      }

      .empty { padding: 14px 8px 3px; text-align: center; }
      .empty-number { font-size: 38px; font-weight: 760; }
      .empty-copy { margin: 6px 0 15px; color: var(--muted); font-size: 13px; }

      @media (max-width: 340px) {
        .view { padding: 14px; }
        .total { font-size: 38px; }
        .balance { min-width: 68px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="count-view" class="view hidden">
        <div class="topline">
          <p class="eyebrow">GUITAR WALL</p>
          <div class="total-wrap">
            <span id="total-remaining" class="total">0</span>
            <span class="total-label">holes remaining</span>
          </div>
        </div>
        <div id="count-rows" class="rows"></div>
        <div class="summary">
          <span id="broken-summary">0 guitars broken out</span>
          <span id="starting-summary">0 starting holes</span>
        </div>
        <div class="actions">
          <button id="new-morning" class="button ghost" type="button">Enter new morning count</button>
        </div>
        <div id="count-error" class="error" aria-live="polite"></div>
      </section>

      <section id="empty-view" class="view hidden">
        <p class="eyebrow">GUITAR WALL</p>
        <div class="empty">
          <div class="empty-number">—</div>
          <p class="empty-copy">Enter the morning hole count to begin.</p>
          <button id="start-morning" class="button primary" type="button">Enter morning count</button>
        </div>
      </section>

      <section id="editor-view" class="view hidden">
        <h2 class="editor-title">Morning hole count</h2>
        <p class="editor-subtitle">Saving replaces the current count and resets today’s breakout progress.</p>
        <form id="morning-form" autocomplete="off">
          <div id="entry-list" class="entry-list"></div>
          <div class="editor-total">
            <span>Total holes</span>
            <strong id="editor-total">0</strong>
          </div>
          <div id="editor-error" class="error" aria-live="polite"></div>
          <div class="actions">
            <button id="add-row" class="button" type="button">+ Add row</button>
            <button id="cancel-editor" class="button ghost" type="button">Cancel</button>
            <button id="save-morning" class="button primary" type="submit">Save</button>
          </div>
        </form>
      </section>
    </main>

    <script type="module">
      const countView = document.querySelector("#count-view");
      const emptyView = document.querySelector("#empty-view");
      const editorView = document.querySelector("#editor-view");
      const countRows = document.querySelector("#count-rows");
      const totalRemaining = document.querySelector("#total-remaining");
      const brokenSummary = document.querySelector("#broken-summary");
      const startingSummary = document.querySelector("#starting-summary");
      const countError = document.querySelector("#count-error");
      const entryList = document.querySelector("#entry-list");
      const editorTotal = document.querySelector("#editor-total");
      const editorError = document.querySelector("#editor-error");
      const saveMorning = document.querySelector("#save-morning");

      const emptySnapshot = () => ({
        initialized: false,
        rows: [],
        totals: { starting: 0, remaining: 0, brokenOut: 0 },
        updatedAt: null,
        revision: 0,
      });

      let snapshot = emptySnapshot();
      let busy = false;

      function showOnly(element) {
        [countView, emptyView, editorView].forEach((view) => view.classList.add("hidden"));
        element.classList.remove("hidden");
      }

      function renderSnapshot() {
        countError.textContent = "";
        if (!snapshot.initialized) {
          showOnly(emptyView);
          return;
        }

        showOnly(countView);
        totalRemaining.textContent = snapshot.totals.remaining;
        brokenSummary.textContent = `${snapshot.totals.brokenOut} guitar${snapshot.totals.brokenOut === 1 ? "" : "s"} broken out`;
        startingSummary.textContent = `${snapshot.totals.starting} starting holes`;
        countRows.replaceChildren();

        for (const row of snapshot.rows) {
          const wrap = document.createElement("div");
          wrap.className = "count-row";

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = row.label;

          const balance = document.createElement("div");
          balance.className = "balance";
          const remaining = document.createElement("span");
          remaining.className = "remaining";
          remaining.textContent = row.remaining;
          const remainingWord = document.createElement("span");
          remainingWord.className = "remaining-word";
          remainingWord.textContent = " remaining";
          balance.append(remaining, remainingWord);

          const minus = document.createElement("button");
          minus.className = "minus";
          minus.type = "button";
          minus.textContent = "−";
          minus.title = `Break out one ${row.label}`;
          minus.setAttribute("aria-label", `Break out one ${row.label} guitar`);
          minus.disabled = busy || row.remaining < 1;
          minus.addEventListener("click", () => breakOutOne(row.label));

          wrap.append(label, balance, minus);
          countRows.appendChild(wrap);
        }
      }

      function addEditorRow(label = "", count = "") {
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <input class="entry-label" type="text" placeholder="Brand / category" aria-label="Brand or category" />
          <input class="entry-count" type="number" min="0" step="1" inputmode="numeric" placeholder="0" aria-label="Hole count" />
          <button class="remove-row" type="button" aria-label="Remove row">×</button>
        `;
        row.querySelector(".entry-label").value = label;
        row.querySelector(".entry-count").value = count;
        row.querySelector(".remove-row").addEventListener("click", () => {
          row.remove();
          if (!entryList.children.length) addEditorRow();
          updateEditorTotal();
        });
        row.querySelector(".entry-count").addEventListener("input", updateEditorTotal);
        entryList.appendChild(row);
      }

      function updateEditorTotal() {
        let total = 0;
        for (const input of entryList.querySelectorAll(".entry-count")) {
          const value = Number(input.value);
          if (Number.isInteger(value) && value >= 0) total += value;
        }
        editorTotal.textContent = total;
      }

      function openEditor() {
        entryList.replaceChildren();
        editorError.textContent = "";
        if (snapshot.rows.length) {
          for (const row of snapshot.rows) addEditorRow(row.label, "");
        } else {
          addEditorRow();
        }
        updateEditorTotal();
        showOnly(editorView);
        setTimeout(() => entryList.querySelector("input")?.focus(), 0);
      }

      function readEditorCounts() {
        const counts = [];
        const labels = new Set();
        for (const row of entryList.querySelectorAll(".entry-row")) {
          const label = row.querySelector(".entry-label").value.trim().replace(/\s+/g, " ");
          const raw = row.querySelector(".entry-count").value;
          if (!label && raw === "") continue;
          const count = Number(raw);
          if (!label) throw new Error("Every count needs a brand or category.");
          if (!Number.isInteger(count) || count < 0) {
            throw new Error(`Enter a whole-number count for ${label}.`);
          }
          const key = label.toLocaleLowerCase();
          if (labels.has(key)) throw new Error(`Remove the duplicate row for ${label}.`);
          labels.add(key);
          counts.push({ label, count });
        }
        if (!counts.length) throw new Error("Enter at least one count.");
        return counts;
      }

      function responseText(response) {
        return response?.content?.find?.((part) => part?.type === "text")?.text ?? "";
      }

      function updateFromResponse(response, { render = true } = {}) {
        if (response?.structuredContent?.snapshot) {
          snapshot = response.structuredContent.snapshot;
          if (render) renderSnapshot();
        }
        const text = responseText(response);
        if (response?.isError && text && render) countError.textContent = text;
      }

      let rpcId = 0;
      const pendingRequests = new Map();
      const hasHost = window.parent !== window;

      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const rpcRequest = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++rpcId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (typeof message.id === "number") {
          const pending = pendingRequests.get(message.id);
          if (!pending) return;
          pendingRequests.delete(message.id);
          if (message.error) pending.reject(message.error);
          else pending.resolve(message.result);
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          updateFromResponse(message.params);
        }
      }, { passive: true });

      const bridgeReady = hasHost
        ? (async () => {
            await rpcRequest("ui/initialize", {
              appInfo: { name: "guitar-hole-count-card", version: "1.0.0" },
              appCapabilities: {},
              protocolVersion: "2026-01-26",
            });
            rpcNotify("ui/notifications/initialized", {});
          })()
        : Promise.resolve();

      async function callTool(name, args, options) {
        await bridgeReady;
        if (!hasHost) return applyStandaloneTool(name, args, options);
        const response = await rpcRequest("tools/call", { name, arguments: args });
        updateFromResponse(response, options);
        return response;
      }

      function applyStandaloneTool(name, args, options) {
        if (name === "set_morning_count") {
          snapshot = {
            initialized: true,
            rows: args.counts.map(({ label, count }) => ({
              label,
              starting: count,
              remaining: count,
              brokenOut: 0,
            })),
            totals: {
              starting: args.counts.reduce((sum, item) => sum + item.count, 0),
              remaining: args.counts.reduce((sum, item) => sum + item.count, 0),
              brokenOut: 0,
            },
            updatedAt: new Date().toISOString(),
            revision: snapshot.revision + 1,
          };
        }
        const response = { structuredContent: { snapshot }, content: [] };
        updateFromResponse(response, options);
        return response;
      }

      async function breakOutOne(label) {
        if (busy) return;
        const before = structuredClone(snapshot);
        const row = snapshot.rows.find((item) => item.label === label);
        if (!row || row.remaining < 1) return;

        // Optimistic render makes the visible balance change on the tap itself;
        // the authoritative server snapshot replaces it as soon as the call returns.
        row.remaining -= 1;
        row.brokenOut += 1;
        snapshot.totals.remaining -= 1;
        snapshot.totals.brokenOut += 1;
        busy = true;
        renderSnapshot();

        try {
          if (hasHost) {
            await callTool("break_out_guitars", {
              breakouts: [{ label, quantity: 1 }],
            });
          }
        } catch (error) {
          snapshot = before;
          countError.textContent = "Couldn’t update the count.";
          console.error(error);
        } finally {
          busy = false;
          renderSnapshot();
        }
      }

      document.querySelector("#new-morning").addEventListener("click", openEditor);
      document.querySelector("#start-morning").addEventListener("click", openEditor);
      document.querySelector("#add-row").addEventListener("click", () => addEditorRow());
      document.querySelector("#cancel-editor").addEventListener("click", renderSnapshot);

      document.querySelector("#morning-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (busy) return;
        try {
          const counts = readEditorCounts();
          busy = true;
          saveMorning.disabled = true;
          saveMorning.textContent = "Saving…";
          editorError.textContent = "";
          const response = await callTool("set_morning_count", { counts }, { render: false });
          if (response?.isError) {
            editorError.textContent = responseText(response) || "Couldn’t save the count.";
          } else {
            renderSnapshot();
          }
        } catch (error) {
          editorError.textContent = error instanceof Error ? error.message : "Couldn’t save the count.";
        } finally {
          busy = false;
          saveMorning.disabled = false;
          saveMorning.textContent = "Save";
          if (!countView.classList.contains("hidden")) renderSnapshot();
        }
      });

      if (!hasHost) {
        snapshot = {
          initialized: true,
          rows: [
            { label: "Fender", starting: 17, remaining: 11, brokenOut: 6 },
            { label: "Gibson", starting: 9, remaining: 7, brokenOut: 2 },
            { label: "Ibanez", starting: 12, remaining: 7, brokenOut: 5 },
          ],
          totals: { starting: 38, remaining: 25, brokenOut: 13 },
          updatedAt: new Date().toISOString(),
          revision: 1,
        };
      }
      renderSnapshot();
    </script>
  </body>
</html>
